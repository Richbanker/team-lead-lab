name: Проверки проекта

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Проверить расписание сводок
        run: |
          python3 -m venv "$RUNNER_TEMP/report-schedule"
          "$RUNNER_TEMP/report-schedule/bin/python" -m pip install PyYAML==6.0.3
          "$RUNNER_TEMP/report-schedule/bin/python" -B scripts/check_report_schedule.py
      - run: python3 -B -m unittest discover -s tests -v
